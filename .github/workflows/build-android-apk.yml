
name: Build Android APK
[![Build Android APK](https://github.com/sagorshill1234-star/AndroidForge/actions/workflows/build-android-apk.yml/badge.svg)](https://github.com/sagorshill1234-star/AndroidForge/actions/workflows/build-android-apk.yml)
on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP file path inside repository"
        required: true
        default: "remix-untitled-app-xxx.zip"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and collect APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Check and extract ZIP
        env:
          ZIP_PATH: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP file not found: $ZIP_PATH"
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-source"
          unzip -q "$ZIP_PATH" \
            -d "$RUNNER_TEMP/android-source"

          echo "ZIP extracted successfully."
          find "$RUNNER_TEMP/android-source" \
            -maxdepth 4 \
            \( -name gradlew \
            -o -name build.gradle \
            -o -name build.gradle.kts \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print

      - name: Find Android project
        id: project
        run: |
          set -euo pipefail

          SRC="$RUNNER_TEMP/android-source"

          ROOT="$(find "$SRC" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name build.gradle \
            -o -name build.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$ROOT" ]; then
            echo "::error::No Gradle build files found in ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$ROOT")"

          # Prefer the directory containing the Gradle settings file.
          SETTINGS="$(find "$SRC" -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

          find "$PROJECT_DIR" -maxdepth 3 -type f \
            | head -200

      - name: Build debug APK
        id: build
        continue-on-error: true
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            gradle --no-daemon --stacktrace assembleDebug
          else
            echo "::error::Gradle wrapper or installed Gradle not found."
            exit 1
          fi

      - name: Collect APK and build logs
        if: always()
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk-output"
          mkdir -p "$RUNNER_TEMP/build-diagnostics"

          {
            echo "Build step outcome: ${BUILD_OUTCOME:-not-started}"
            echo
            echo "APK files found:"
          } > "$RUNNER_TEMP/build-diagnostics/summary.txt"

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
            find "$PROJECT_DIR" -type f -name "*.apk" \
              -not -path '*/.gradle/*' \
              -print | tee -a \
              "$RUNNER_TEMP/build-diagnostics/summary.txt"

            find "$PROJECT_DIR" -type f -name "*.apk" \
              -not -path '*/.gradle/*' \
              -exec cp --parents {} "$RUNNER_TEMP/apk-output/" \;
          fi

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
            find "$PROJECT_DIR" -type f \
              \( -name "*.log" -o -name "build.json" \
              -o -name "collect.json" \) \
              -not -path '*/.gradle/*' \
              -exec cp --parents {} \
              "$RUNNER_TEMP/build-diagnostics/" \;
          fi

          echo
          cat "$RUNNER_TEMP/build-diagnostics/summary.txt"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ runner.temp }}/apk-output/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Logs
          path: ${{ runner.temp }}/build-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if APK was not built
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          APK_DIR="$RUNNER_TEMP/apk-output"

          if ! find "$APK_DIR" -type f -name "*.apk" \
            -print -quit | grep -q .; then
            echo "::error::No APK was produced."
            echo "Download Android-Build-Logs to investigate."
            exit 1
          fi

          if [ "$BUILD_OUTCOME" != "success" ]; then
            echo "::warning::An APK was found, but the build step reported failure."
          fi

          echo "APK file(s) collected."
